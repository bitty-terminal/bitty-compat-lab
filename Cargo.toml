[workspace]
members = [
    "crates/bitty-compat-lab",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Bitty compat-lab validation workspace"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bitty-terminal/bitty-compat-lab"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
